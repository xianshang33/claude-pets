    <rect x="134" y="110" width="72" height="48" rx="20" fill="#f6d7b0"/>
    <circle cx="154" cy="133" r="6" fill="#26302c"/>
    <circle cx="186" cy="133" r="6" fill="#26302c"/>
  </g>
  <g transform="translate(455 170)">
