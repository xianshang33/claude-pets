<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="520" viewBox="0 0 1520 520" role="img" aria-labelledby="title desc">
  <title id="title">Claude Pets demo placeholder</title>
  <desc id="desc">A storyboard placeholder for the future Claude Pets demo GIF.</desc>
  <rect width="1520" height="520" rx="30" fill="#f5f1ea"/>
