    <text x="170" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#37413d">2. Working</text>
    <circle cx="170" cy="130" r="56" fill="#2f7d5c"/>
    <text x="170" y="140" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="48" fill="#ffffff">...</text>
  </g>
  <g transform="translate(800 170)">
